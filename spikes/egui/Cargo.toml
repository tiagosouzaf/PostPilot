[package]
name = "spike-egui"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
eframe = { version = "0.36", features = ["glow"] }
egui_extras = "0.36"
egui_dock = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
[workspace]
