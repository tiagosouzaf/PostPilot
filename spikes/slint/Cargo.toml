[package]
name = "spike-slint"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
slint = "1.18"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
