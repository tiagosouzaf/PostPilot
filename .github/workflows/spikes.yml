name: Spikes (Fase 0)

# Compila e mede os protótipos de GUI em Linux. O runner não tem GPU: roda sob
# Xvfb com Mesa (llvmpipe/lavapipe). Os números servem para comparar os
# toolkits entre si, não como medida absoluta. Não roda em Windows para não
# gastar minutos do GitHub Actions (runners de Windows cobram em dobro).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spikes/**"
      - ".github/workflows/spikes.yml"

jobs:
  bench:
    name: ${{ matrix.toolkit }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolkit: [egui, slint, gpui]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolkit == 'gpui' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: spikes/${{ matrix.toolkit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/${{ matrix.toolkit }}
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libxcb1-dev libwayland-dev libvulkan-dev \
            mesa-vulkan-drivers libgl1-mesa-dri
      - name: Build
        run: cargo build --release
      - name: Tamanho do binário
        run: ls -l target/release/spike-${{ matrix.toolkit }}* | tee -a bench.txt
      - name: Benchmark
        run: |
          for i in 1 2 3; do
            SPIKE_BENCH=1 SPIKE_IDLE_SECS=15 timeout 180 \
              xvfb-run -a -s "-screen 0 1600x1000x24" ./target/release/spike-${{ matrix.toolkit }} \
              2>/dev/null | grep '=' | tr '\n' ' ' | tee -a bench.txt || echo "falhou ou excedeu o tempo" | tee -a bench.txt
            echo | tee -a bench.txt
          done
      - name: Resumo
        if: always()
        run: |
          echo "### ${{ matrix.toolkit }} em ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bench.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.toolkit }}-${{ matrix.os }}
          path: spikes/${{ matrix.toolkit }}/bench.txt
