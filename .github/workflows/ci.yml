name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Clippy e testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  postgres:
    name: PostgreSQL ${{ matrix.pg }}
    strategy:
      fail-fast: false
      matrix:
        # A menor e a maior versão suportadas.
        pg: ["13", "17"]
    runs-on: ubuntu-latest
    env:
      PGSTUDIO_TEST_HOST: 127.0.0.1
      PGSTUDIO_TEST_PORT: "5432"
      PGSTUDIO_TEST_USER: postgres
      PGSTUDIO_TEST_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Servidor com TLS (certificado próprio) e senha, para testar os modos
      # de Encryption e os erros de login.
      - name: Subir o PostgreSQL ${{ matrix.pg }}
        run: |
          mkdir certs
          openssl req -new -x509 -days 2 -nodes -subj /CN=localhost \
            -out certs/server.crt -keyout certs/server.key
          sudo chown 999:999 certs/server.crt certs/server.key
          sudo chmod 600 certs/server.key
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            -v "$PWD/certs:/certs:ro" postgres:${{ matrix.pg }} \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 1
          done
          docker logs pg
          exit 1
      - run: cargo test --locked -p pgstudio-pg-client -p pgstudio-pg-metadata

  screenshot:
    name: Janela (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri
      - run: cargo build --release --locked -p pgstudio-desktop
      # Abre a janela, salva um PNG e fecha; falha se a janela não abrir.
      - name: Screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          for theme in light dark; do
            PGSTUDIO_THEME=$theme PGSTUDIO_SCREENSHOT=postpilot-$theme.png timeout 120 \
              xvfb-run -a -s "-screen 0 1400x900x24" ./target/release/postpilot
            test -s postpilot-$theme.png
          done
          PGSTUDIO_CONNECT=dialog PGSTUDIO_SCREENSHOT=pgstudio-connect.png timeout 120 \
            xvfb-run -a -s "-screen 0 1400x900x24" ./target/release/postpilot
          test -s pgstudio-connect.png
      - name: Screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($theme in "light", "dark") {
            $env:PGSTUDIO_THEME = $theme
            $env:PGSTUDIO_SCREENSHOT = "postpilot-$theme.png"
            $p = Start-Process -FilePath ".\target\release\postpilot.exe" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "a janela não fechou a tempo" }
            if (-not (Test-Path "postpilot-$theme.png")) { throw "screenshot não gerado" }
          }
          $env:PGSTUDIO_THEME = "light"
          $env:PGSTUDIO_CONNECT = "dialog"
          $env:PGSTUDIO_SCREENSHOT = "pgstudio-connect.png"
          $p = Start-Process -FilePath ".\target\release\postpilot.exe" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "a janela não fechou a tempo" }
          if (-not (Test-Path "pgstudio-connect.png")) { throw "screenshot não gerado" }
      - uses: actions/upload-artifact@v4
        with:
          name: janela-${{ matrix.os }}
          path: postpilot-*.png

  bench:
    name: Medição (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri
      - run: cargo build --release --locked -p pgstudio-desktop
      # Só informa: as metas ainda não reprovam o CI (veja docs/benchmarks.md).
      - name: cargo xtask bench
        shell: bash
        run: |
          run="cargo xtask bench --no-build --runs 5 --idle 30 --markdown"
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a -s '-screen 0 1400x900x24' $run"; fi
          eval "$run" | tee bench.md
          { echo "### Medição em ${{ matrix.os }}"; echo; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench.md

  deny:
    name: Licenças e vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
