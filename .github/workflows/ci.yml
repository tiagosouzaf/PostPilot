name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Clippy e testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  screenshot:
    name: Janela (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri
      - run: cargo build --release --locked -p pgstudio-desktop
      # Abre a janela, salva um PNG e fecha; falha se a janela não abrir.
      - name: Screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          for theme in light dark; do
            PGSTUDIO_THEME=$theme PGSTUDIO_SCREENSHOT=pgstudio-$theme.png timeout 120 \
              xvfb-run -a -s "-screen 0 1400x900x24" ./target/release/pgstudio
            test -s pgstudio-$theme.png
          done
      - name: Screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($theme in "light", "dark") {
            $env:PGSTUDIO_THEME = $theme
            $env:PGSTUDIO_SCREENSHOT = "pgstudio-$theme.png"
            $p = Start-Process -FilePath ".\target\release\pgstudio.exe" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "a janela não fechou a tempo" }
            if (-not (Test-Path "pgstudio-$theme.png")) { throw "screenshot não gerado" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: janela-${{ matrix.os }}
          path: pgstudio-*.png

  bench:
    name: Medição (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri
      - run: cargo build --release --locked -p pgstudio-desktop
      # Só informa: as metas ainda não reprovam o CI (veja docs/benchmarks.md).
      - name: cargo xtask bench
        shell: bash
        run: |
          run="cargo xtask bench --no-build --runs 5 --idle 30 --markdown"
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a -s '-screen 0 1400x900x24' $run"; fi
          eval "$run" | tee bench.md
          { echo "### Medição em ${{ matrix.os }}"; echo; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench.md

  deny:
    name: Licenças e vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
