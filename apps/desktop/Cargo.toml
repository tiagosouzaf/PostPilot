[package]
name = "pgstudio-desktop"
description = "Aplicativo desktop do PGStudio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pgstudio"
path = "src/main.rs"

[dependencies]
pgstudio-core.workspace = true
pgstudio-ui-shell.workspace = true
pgstudio-pg-metadata.workspace = true
# glow (OpenGL) junto com o wgpu padrão: `--renderer glow` e a reserva
# quando o wgpu não abre (marco 6.6).
eframe = { workspace = true, features = ["glow"] }
rfd.workspace = true

[lints]
workspace = true
