[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/ui-shell",
    "crates/docking",
    "crates/object-explorer",
    "crates/pg-client",
    "crates/pg-metadata",
    "crates/sql-editor",
    "crates/result-grid",
    "crates/schema-model",
    "crates/diagram-engine",
    "crates/execution-plan",
    "crates/automation",
    "crates/updater",
    "crates/i18n",
    "crates/mssql",
    "crates/ssh",
    "crates/redis",
    "crates/mongodb",
    "crates/elasticsearch",
    "crates/federated",
    "xtask",
]
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.2.60"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiagosouzaf/postpilot"

[workspace.dependencies]
pgstudio-core = { path = "crates/core" }
pgstudio-ui-shell = { path = "crates/ui-shell" }
pgstudio-docking = { path = "crates/docking" }
pgstudio-object-explorer = { path = "crates/object-explorer" }
pgstudio-pg-client = { path = "crates/pg-client" }
pgstudio-pg-metadata = { path = "crates/pg-metadata" }
pgstudio-sql-editor = { path = "crates/sql-editor" }
pgstudio-result-grid = { path = "crates/result-grid" }
pgstudio-schema-model = { path = "crates/schema-model" }
pgstudio-diagram-engine = { path = "crates/diagram-engine" }
pgstudio-execution-plan = { path = "crates/execution-plan" }
pgstudio-automation = { path = "crates/automation" }
pgstudio-updater = { path = "crates/updater" }
pgstudio-i18n = { path = "crates/i18n" }
pgstudio-mssql = { path = "crates/mssql" }
pgstudio-ssh = { path = "crates/ssh" }
pgstudio-redis = { path = "crates/redis" }
pgstudio-mongodb = { path = "crates/mongodb" }
pgstudio-elasticsearch = { path = "crates/elasticsearch" }
pgstudio-federated = { path = "crates/federated" }
# egui fica na 0.36 enquanto o egui_dock (marco 1.4) não acompanhar a 0.37.
eframe = "0.36"
egui_kittest = "0.36"
egui_dock = "0.21"
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Idioma do sistema para a interface (GetUserDefaultLocaleName / LANG).
sys-locale = "0.3"
# Lê o SELECT do editor no Query Designer (marco 5.5).
sqlparser = { version = "0.64", features = ["visitor"] }
# PostgreSQL (Fase 2). tokio-postgres em vez de SQLx: vários comandos por
# execução, resultados de tipo desconhecido em texto e cancelamento.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
futures-util = { version = "0.3", default-features = false }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# TLS do Redis (Fase N): o mesmo rustls com ring, sem aws-lc.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# SQL Server (Fase S, ADR 0004): tiberius no repositório, com o patch que
# devolve mensagens, contagens e todos os erros do lote (Client::batch).
tiberius = { path = "vendor/tiberius", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio", "winauth"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Túnel SSH das conexões (banco atrás de bastion): cliente SSH em Rust puro,
# com o ring (o mesmo do rustls) em vez do aws-lc, que complica o Windows.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
# Cofre do sistema para "Remember password" (marco 5.4). A 3.x pela MSRV de então (1.87);
# no Linux, Secret Service por zbus (Rust puro, sem libdbus).
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "async-secret-service", "async-io", "crypto-rust"] }
# Tema do sistema no Linux (portal do freedesktop); o mesmo zbus que o
# keyring e o accesskit já trazem.
zbus = { version = "5.13", default-features = false, features = ["async-io", "blocking-api"] }
# Cofre de senhas do workspace (Fase R): Argon2id para a senha mestra e
# XChaCha20-Poly1305 para cada senha, ambos do RustCrypto.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
base64 = "0.22"
zeroize = "1"
# Hora local no histórico de consultas (o fuso vem do sistema).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# ZIP do Excel (.xlsx) em "Save Results As": deflate em Rust puro e CRC-32.
flate2 = "1"
crc32fast = "1"
# Consulta entre servidores: as fontes de cada servidor vão para um SQLite
# local (embutido no binário), que faz o join. `hooks` dá o autorizador que
# deixa o SQL local só ler.
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# O Argon2 sem otimização leva segundos para destravar o cofre em debug.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Binários dos pacotes (`cargo xtask dist`): o release sem símbolos.
[profile.dist]
inherits = "release"
# Sem as informações de depuração, mas com os nomes das funções: é o que
# faz a pilha de uma queda no `postpilot.log` dizer onde ela aconteceu.
strip = "debuginfo"
