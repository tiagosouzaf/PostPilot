[workspace]
resolver = "3"
members = ["apps/desktop", "crates/core", "crates/ui-shell"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiagosouzaf/postpilot"

[workspace.dependencies]
pgstudio-core = { path = "crates/core" }
pgstudio-ui-shell = { path = "crates/ui-shell" }
# egui fica na 0.36 enquanto o egui_dock (marco 1.4) não acompanhar a 0.37.
eframe = "0.36"
egui_kittest = "0.36"
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
