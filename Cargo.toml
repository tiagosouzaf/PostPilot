[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/ui-shell",
    "crates/docking",
    "crates/object-explorer",
    "crates/pg-client",
    "crates/pg-metadata",
    "crates/sql-editor",
    "crates/result-grid",
    "crates/schema-model",
    "crates/diagram-engine",
    "crates/execution-plan",
    "xtask",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiagosouzaf/postpilot"

[workspace.dependencies]
pgstudio-core = { path = "crates/core" }
pgstudio-ui-shell = { path = "crates/ui-shell" }
pgstudio-docking = { path = "crates/docking" }
pgstudio-object-explorer = { path = "crates/object-explorer" }
pgstudio-pg-client = { path = "crates/pg-client" }
pgstudio-pg-metadata = { path = "crates/pg-metadata" }
pgstudio-sql-editor = { path = "crates/sql-editor" }
pgstudio-result-grid = { path = "crates/result-grid" }
pgstudio-schema-model = { path = "crates/schema-model" }
pgstudio-diagram-engine = { path = "crates/diagram-engine" }
pgstudio-execution-plan = { path = "crates/execution-plan" }
# egui fica na 0.36 enquanto o egui_dock (marco 1.4) não acompanhar a 0.37.
eframe = "0.36"
egui_kittest = "0.36"
egui_dock = "0.21"
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PostgreSQL (Fase 2). tokio-postgres em vez de SQLx: vários comandos por
# execução, resultados de tipo desconhecido em texto e cancelamento.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
futures-util = { version = "0.3", default-features = false }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# Cofre do sistema para "Remember password" (marco 5.4). A 3.x pela MSRV 1.87;
# no Linux, Secret Service por zbus (Rust puro, sem libdbus).
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "async-secret-service", "async-io", "crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Binários dos pacotes (`cargo xtask dist`): o release sem símbolos.
[profile.dist]
inherits = "release"
strip = true
