[workspace]
resolver = "3"
members = ["apps/desktop", "crates/core"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiagosouzaf/postpilot"

[workspace.dependencies]
pgstudio-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
