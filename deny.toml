# Configuração do cargo-deny: licenças, vulnerabilidades e origem das dependências.

[graph]
all-features = true

[advisories]
version = 2
# Crates sem manutenção só barram o CI quando são dependência direta nossa; as
# transitivas (fontes e acessibilidade do egui) aparecem no relatório.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.38 chega via accesskit -> atspi -> zbus_xml, que só lê as
    # descrições de interface D-Bus embutidas nas próprias crates, nunca
    # entrada externa. Remover quando o egui atualizar o accesskit.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml só lê XML embutido do atspi" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml só lê XML embutido do atspi" },
    # Marvin Attack na crate rsa: a correção é a série 0.10 (crypto-bigint e
    # tempo constante), e o russh usa a 0.10.0-rc.18, que já é dessa série mas,
    # por ser pré-lançamento, fica "abaixo" da 0.10.0 do aviso. No túnel SSH a
    # chave RSA só assina o login do próprio usuário. Remover quando o russh
    # passar para a rsa 0.10 final.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc.18 (via russh) já é da série corrigida" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # Fontes padrão do egui (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
